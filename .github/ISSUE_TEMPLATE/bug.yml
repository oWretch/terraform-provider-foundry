name: Bug report
description: Report incorrect provider behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, tenant details, or other sensitive data.
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: Terraform or OpenTofu version
      placeholder: Terraform 1.11.0
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: Provide a minimal configuration with sensitive values removed.
      render: terraform
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
