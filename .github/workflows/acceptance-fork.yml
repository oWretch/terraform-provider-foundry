name: Azure acceptance for forks

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  acceptance:
    if: github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/acceptance-run.yml
    permissions:
      contents: read
      id-token: write
      statuses: write
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      commit_sha: ${{ github.event.pull_request.head.sha }}
