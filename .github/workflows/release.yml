name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run: building a snapshot without publishing."
            exit 0
          fi
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH with an optional SemVer prerelease (for example, v1.2.3-rc.1), without leading zeroes or build metadata."
            exit 1
          fi

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Load signing key
        id: op
        uses: 1password/load-secrets-action@5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GPG_PRIVATE_KEY: op://terraform-provider-foundry/signing-private-key/signing-private-key.asc
      - name: Import signing key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ steps.op.outputs.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Prepare manifest attestation
        run: |
          manifest_name=$(awk '$2 ~ /_manifest.json$/ {print $2}' dist/*_SHA256SUMS)
          test -n "$manifest_name"
          cp terraform-registry-manifest.json "dist/$manifest_name"
      - name: Verify signature and checksums
        working-directory: dist
        run: |
          gpg --batch --verify ./*_SHA256SUMS.sig ./*_SHA256SUMS
          sha256sum --check --strict ./*_SHA256SUMS
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_SHA256SUMS.sig
            dist/*_manifest.json
          retention-days: 7
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_SHA256SUMS.sig
            dist/*_manifest.json
