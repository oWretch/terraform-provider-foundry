name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.11.0
          tofu_wrapper: false
      - run: test -z "$(gofmt -l .)"
      - name: Generate Registry documentation
        run: make docs
      - name: Run offline checks and validate Registry documentation
        run: make check

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: golang/govulncheck-action@v1.1.0

  terraform:
    strategy:
      matrix:
        version:
          - 1.11.0
          - 1.16.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - run: ./scripts/validate-example.sh terraform

  opentofu:
    strategy:
      matrix:
        version:
          - 1.11.0
          - 1.12.6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - run: ./scripts/validate-example.sh tofu
